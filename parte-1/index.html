<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Formulario HTML y CSS</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <main class="form-page">
        <section class="form-section">
            <div class="form-container">
                <header class="form-header">
                    <span class="eyebrow">CONTACTO</span>
                    <h1>Cuéntenos sobre su necesidad</h1>
                    <p>
                        Complete el formulario. Los campos marcados con
                        <strong>*</strong> son obligatorios.
                    </p>
                </header>

                <form class="contact-form" action="#" method="post">

                    <!-- Datos personalse -->
                    <section class="form-block">
                        <h2>Datos personales</h2>

                        <div class="form-grid">
                            <div class="form-field">
                                <label for="nombre">
                                    Nombre
                                    <span class="required-mark" aria-hidden="true">*</span>
                                </label>
                                <input
                                    type="text"
                                    id="nombre"
                                    name="nombre"
                                    autocomplete="given-name"
                                    placeholder="Laura"
                                    required
                                >
                            </div>

                            <div class="form-field">
                                <label for="apellido">
                                    Apellido
                                    <span class="required-mark" aria-hidden="true">*</span>
                                </label>
                                <input
                                    type="text"
                                    id="apellido"
                                    name="apellido"
                                    autocomplete="family-name"
                                    placeholder="Martínez"
                                    required
                                >
                            </div>
                        </div>

                        <div class="form-grid">
                            <div class="form-field">
                                <label for="email">
                                    Correo
                                    <span class="required-mark" aria-hidden="true">*</span>
                                </label>
                                <input
                                    type="email"
                                    id="email"
                                    name="email"
                                    autocomplete="email"
                                    placeholder="nombre@empresa.com"
                                    required
                                >
                            </div>

                            <div class="form-field">
                                <label for="telefono">Teléfono</label>
                                <input
                                    type="tel"
                                    id="telefono"
                                    name="telefono"
                                    autocomplete="tel"
                                    placeholder="+57 300 000 0000"
                                >
                            </div>
                        </div>
                    </section>

                    <!-- Organizacion -->
                    <section class="form-block">
                        <h2>Organización</h2>

                        <div class="form-grid">
                            <div class="form-field">
                                <label for="empresa">Empresa</label>
                                <input
                                    type="text"
                                    id="empresa"
                                    name="empresa"
                                    autocomplete="organization"
                                >
                            </div>

                            <div class="form-field">
                                <label for="empleados">Número de empleados</label>
                                <input
                                    type="number"
                                    id="empleados"
                                    name="empleados"
                                    min="1"
                                    step="1"
                                >
                            </div>
                        </div>

                        <div class="form-field">
                            <label for="servicio">
                                Servicio de interés
                                <span class="required-mark" aria-hidden="true">*

                                </span>
                            </label>
                            <select id="servicio" name="servicio" required>
                                <option value="" selected disabled>Seleccione un servicio</option>
                                <optgroup label="Auditorías de Seguridad">
                                    <option value="pentesting">Pentesting</option>
                                    <option value="hacking-etico">Hacking Ético</option>
                                    <option value="iso27001">ISO 27001</option>
                                </optgroup>
                                <optgroup label="Desarrollo Seguro">
                                    <option value="ssdlc">SSDLc</option>
                                    <option value="devsecops">DevSecOps</option>
                                    <option value="ai-security">AI Security</option>
                                </optgroup>
                            </select>
                        </div>
                    </section>

                    <!-- Agenda -->
                    <section class="form-block">
                        <h2>Disponibilidad</h2>

                        <div class="form-grid">
                            <div class="form-field">
                                <label for="fecha">Fecha preferida</label>
                                <input
                                    type="date"
                                    id="fecha"
                                    name="fecha"
                                >
                            </div>

                            <div class="form-field">
                                <label for="hora">Hora preferida</label>
                                <input
                                    type="time"
                                    id="hora"
                                    name="hora"
                                >
                            </div>
                        </div>
                    </section>

                    <!-- Modalidad -->
                    <fieldset>
                        <legend>Modalidad de contacto</legend>
                        <div class="choice-list">
                            <label class="choice">
                                <input
                                    type="radio"
                                    name="modalidad"
                                    value="correo"
                                    checked
                                >
                                <span>Correo electrónico</span>
                            </label>

                            <label class="choice">
                                <input
                                    type="radio"
                                    name="modalidad"
                                    value="telefono"
                                >
                                <span>Teléfono</span>
                            </label>

                            <label class="choice">
                                <input
                                    type="radio"
                                    name="modalidad"
                                    value="videollamada"
                                >
                                <span>Videollamada</span>
                            </label>
                        </div>
                    </fieldset>

                    <!-- Temas de interes -->
                    <fieldset>
                        <legend>Temas de interés</legend>
                        <div class="choice-list">
                            <label class="choice">
                                <input
                                    type="checkbox"
                                    name="intereses"
                                    value="pentesting"
                                >
                                <span>Pentesting</span>
                            </label>

                            <label class="choice">
                                <input
                                    type="checkbox"
                                    name="intereses"
                                    value="devsecops"
                                >
                                <span>DevSecOps</span>
                            </label>

                            <label class="choice">
                                <input
                                    type="checkbox"
                                    name="intereses"
                                    value="ai-security"
                                >
                                <span>AI Security</span>
                            </label>
                        </div>
                    </fieldset>

                    <!-- Rango y color  -->
                    <div class="form-grid">
                        <div class="form-field">
                            <label for="rango">Rango de inversión estimado</label>
                            <input
                                type="range"
                                id="rango"
                                name="rango"
                                min="1"
                                max="5"
                                value="3"
                            >
                        </div>

                        <div class="form-field">
                            <label for="color">Color preferido</label>
                            <input
                                type="color"
                                id="color"
                                name="color"
                                value="#0d5bea"
                            >
                        </div>
                    </div>

                    <!-- Archivo  -->
                    <div class="form-field">
                        <label for="archivo">Documento de soporte</label>
                        <input
                            type="file"
                            id="archivo"
                            name="archivo"
                            accept=".pdf,.doc,.docx,.xlsx"
                        >
                        <small class="field-help">
                            Formatos sugeridos: PDF, Word o Excel.
                        </small>
                    </div>

                    <!-- Mensaje  -->
                    <div class="form-field">
                        <label for="mensaje">
                            Cuéntenos sobre su necesidad
                            <span class="required-mark" aria-hidden="true">*</span>
                        </label>
                        <textarea
                            id="mensaje"
                            name="mensaje"
                            rows="7"
                            maxlength="1200"
                            placeholder="Cuéntenos brevemente qué necesita..."
                            required
                        ></textarea>
                        <small class="field-help">
                            Máximo 1200 caracteres.
                        </small>
                    </div>

                    <!-- Terminos -->
                    <label class="choice">
                        <input
                            type="checkbox"
                            name="terminos"
                            required
                        >
                        <span>
                            Acepto el tratamiento de la información suministrada.
                        </span>
                    </label>

                    <!-- Botones -->
                    <div class="form-actions">
                        <button
                            type="submit"
                            class="button button-primary"
                        >
                            Enviar solicitud
                        </button>
                        <button
                            type="reset"
                            class="button button-secondary"
                        >
                            Limpiar
                        </button>
                    </div>

                </form>
            </div>
        </section>
    </main>
</body>
</html>
