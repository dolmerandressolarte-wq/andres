<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ejercicio 1</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="styles.css">
</head>

<body>
     
    <main class="form-page">
        <section class="form-section">
            <div class="form-container">
                <header class="form-header">
                    <span class="eyebrow">CREA TU CUENTA AQUI</span>
                    <h1>Regístrate</h1>
                    <p>
                        Complete el formulario para crear su cuenta los campos marcados con
                        <strong>*</strong> son obligatorios.
                    </p>
                </header>

                <form class="contact-form" action="#" method="post">

                    <!-- Datos para acceder-->
                    <section class="form-block">
                        <h2>Datos de acceso</h2>

                        <div class="form-field">
                            <label for="nombre">
                                Nombre completo
                                <span class="required-mark" aria-hidden="true">*</span>
                            </label>
                            <input
                                type="text"
                                id="nombre"
                                name="nombre"
                                autocomplete="name"
                                placeholder="Juan Pérez"
                                required
                            >
                        </div>

                        <div class="form-field">
                            <label for="email">
                                Correo electrónico
                                <span class="required-mark" aria-hidden="true">*</span>
                            </label>
                            <input
                                type="email"
                                id="email"
                                name="email"
                                autocomplete="email"
                                placeholder="tu@correo.com"
                                aria-describedby="email-help"
                                required
                            >
                            <small id="email-help" class="field-help">
                                Usaremos este correo para confirmar tu cuenta.
                            </small>
                        </div>
                    </section>

                    <!-- Seguridad -->
                    <section class="form-block">
                        <h2>Contraseña</h2>

                        <div class="form-grid">
                            <div class="form-field">
                                <label for="password">
                                    Contraseña
                                    <span class="required-mark" aria-hidden="true">*</span>
                                </label>
                                <input
                                    type="password"
                                    id="password"
                                    name="password"
                                    minlength="8"
                                    autocomplete="new-password"
                                    aria-describedby="password-help"
                                    required
                                >
                            </div>

                            <div class="form-field">
                                <label for="password2">
                                    Confirmar contraseña
                                    <span class="required-mark" aria-hidden="true">*</span>
                                </label>
                                <input
                                    type="password"
                                    id="password2"
                                    name="password2"
                                    minlength="8"
                                    autocomplete="new-password"
                                    aria-describedby="password-help"
                                    required
                                >
                            </div>
                        </div>

                        <small id="password-help" class="field-help">
                            La contraseña debe tener mínimo 8 caracteres.
                        </small>
                    </section>

                    <!-- Confirmacion visual de terminos  -->
                    <fieldset>
                        <legend>Confirmación de términos</legend>
                        <div class="choice-list">
                            <label class="choice">
                                <input
                                    type="checkbox"
                                    name="terminos"
                                    required
                                >
                                <span>
                                    Acepto los <strong>términos y condiciones</strong> del servicio.
                                </span>
                            </label>

                            <label class="choice">
                                <input
                                    type="checkbox"
                                    name="privacidad"
                                    required
                                >
                                <span>
                                    Acepto la <strong>política de tratamiento de datos personales</strong>.
                                </span>
                            </label>
                        </div>
                    </fieldset>

                    <!-- Botones -->
                    <div class="form-actions">
                        <button
                            type="submit"
                            class="button button-primary"
                        >
                            Crear cuenta
                        </button>
                        <button
                            type="reset"
                            class="button button-secondary"
                        >
                            Limpiar
                        </button>
                    </div>

                </form>
            </div>

        </section>

    </main>

</body>

</html>
