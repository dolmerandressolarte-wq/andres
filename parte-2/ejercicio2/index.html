<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ejercicio 2: Reserva</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <main class="form-page">
        <section class="form-section">
            <div class="form-container">
                <header class="form-header">
                   
                    <h1>Reserve su mesa</h1>
                    <p>
                        Complete los datos y confirmaremos su reserva 
                        los campos marcados con <strong>*</strong> son obligatorios.
                    </p>
                </header>

                <form class="contact-form" action="#" method="post">

                    <!-- PASO 1 -->
                    <section class="form-block">
                        <h2>
                            ¿Cuándo?
                        </h2>

                        <div class="form-grid">
                            <div class="form-field">
                                <label for="fecha">
                                    Fecha
                                    <span class="required-mark" aria-hidden="true">*</span>
                                </label>
                                <input
                                    type="date"
                                    id="fecha"
                                    name="fecha"
                                    required
                                >
                            </div>

                            <div class="form-field">
                                <label for="hora">
                                    Hora
                                    <span class="required-mark" aria-hidden="true">*</span>
                                </label>
                                <input
                                    type="time"
                                    id="hora"
                                    name="hora"
                                    required
                                >
                            </div>
                        </div>
                    </section>

                    <!-- PASO 2 -->
                    <section class="form-block">
                        <h2>
                            
                            ¿Cuántos son?
                        </h2>

                        <div class="form-grid">
                            <div class="form-field">
                                <label for="personas">
                                    Número de personas
                                    <span class="required-mark" aria-hidden="true">*</span>
                                </label>
                                <input
                                    type="number"
                                    id="personas"
                                    name="personas"
                                    min="1"
                                    max="20"
                                    step="1"
                                    value="2"
                                    required
                                >
                                <small class="field-help">
                                    Máximo 20 personas por mesa.
                                </small>
                            </div>

                            <div class="form-field">
                                <label for="nombre">
                                    ¿A nombre de quién?
                                    <span class="required-mark" aria-hidden="true">*</span>
                                </label>
                                <input
                                    type="text"
                                    id="nombre"
                                    name="nombre"
                                    autocomplete="name"
                                    placeholder="Ej. María Rodríguez"
                                    required
                                >
                            </div>
                        </div>

                        <div class="form-field">
                            <label for="telefono">
                                Teléfono 
                                <span class="required-mark" aria-hidden="true">*</span>
                            </label>
                            <input
                                type="tel"
                                id="telefono"
                                name="telefono"
                                autocomplete="tel"
                                placeholder="+57 300 000 0000"
                                required
                            >
                        </div>
                    </section>

                    <!-- PASO 3 -->
                    <section class="form-block">
                        <h2>

                            Preferencias
                        </h2>

                        <fieldset>
                            <legend>Zona preferida</legend>
                            <div class="choice-list">
                                <label class="choice">
                                    <input type="radio" name="zona" value="interior" checked>
                                    <span>Interior</span>
                                </label>

                                <label class="choice">
                                    <input type="radio" name="zona" value="terraza">
                                    <span>Terraza</span>
                                </label>

                                <label class="choice">
                                    <input type="radio" name="zona" value="ventana">
                                    <span>Zona VIP</span>
                                </label>

                                <label class="choice">
                                    <input type="radio" name="zona" value="barra">
                                    <span>Barra</span>
                                </label>
                            </div>
                        </fieldset>
                    </section>

                    <!-- PASO 4 -->
                    <section class="form-block">
                        <h2>
                            Comentarios
                        </h2>

                        <div class="form-field">
                            <label for="comentarios">
                                Cuéntenos sobre su visita
                            </label>
                            <textarea
                                id="comentarios"
                                name="comentarios"
                                rows="5"
                                maxlength="500"
                                placeholder="Deje sus comentarios aquí..."
                            ></textarea>
                            <small class="field-help">
                                Máximo 500 caracteres. (Opcional)
                            </small>
                        </div>
                    </section>

                    <!-- TÉRMINOS -->
                    <label class="choice">
                        <input type="checkbox" name="terminos" required>
                        <span>
                            Acepto la <strong>política de reservas</strong> y
                            el uso de mis datos para gestionar la reserva.
                        </span>
                    </label>

                    <!-- BOTONES -->
                    <div class="form-actions">
                        <button type="submit" class="button button-primary">
                            Confirmar reserva
                        </button>
                        <button type="reset" class="button button-secondary">
                            Limpiar
                        </button>
                    </div>

                </form>
            </div>
        </section>
    </main>
</body>
</html>
