<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ejercicio 5</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <main class="form-page">
        <section class="form-section">
            <div class="form-container">
                <header class="form-header">
                    <h1>Seleccione departamento y servicio</h1>
                    <p>
                        Utilice las listas desplegables para elegir el área y el
                        servicio que necesita los campos marcados con
                        <strong>*</strong> son obligatorios.
                    </p>
                </header>

                <form class="contact-form" action="#" method="post">

                    <!-- Seleccion principal -->
                    <section class="form-block">
                        <h2>Departamento y servicio</h2>

                        <div class="form-field">
                            <label for="departamento">
                                Departamento
                                <span class="required-mark" aria-hidden="true">*</span>
                            </label>
                            <select id="departamento" name="departamento" required>
                                <option value="" selected disabled>Seleccione un departamento</option>
                                <optgroup label="Tecnología">
                                    <option value="desarrollo">Desarrollo de Software</option>
                                    <option value="infraestructura">Infraestructura TI</option>
                                    <option value="seguridad">Seguridad Informática</option>
                                    <option value="datos">Ciencia de Datos</option>
                                </optgroup>
                                <optgroup label="Negocios">
                                    <option value="ventas">Ventas</option>
                                    <option value="marketing">Marketing</option>
                                    <option value="finanzas">Finanzas</option>
                                    <option value="rrhh">Recursos Humanos</option>
                                </optgroup>
                                <optgroup label="Operaciones">
                                    <option value="produccion">Producción</option>
                                    <option value="logistica">Logística</option>
                                    <option value="calidad">Control de Calidad</option>
                                </optgroup>
                                <optgroup label="Atención al Cliente">
                                    <option value="soporte">Soporte Técnico</option>
                                    <option value="servicio">Servicio al Cliente</option>
                                    <option value="postventa">Postventa</option>
                                </optgroup>
                            </select>
                        </div>

                        <div class="form-field">
                            <label for="servicio">
                                Servicio específico
                                <span class="required-mark" aria-hidden="true">*</span>
                            </label>
                            <select id="servicio" name="servicio" required>
                                <option value="" selected disabled>Seleccione un servicio</option>
                                <optgroup label="Consultoría">
                                    <option value="auditoria">Auditoría</option>
                                    <option value="asesoria">Asesoría</option>
                                    <option value="diagnostico">Diagnóstico</option>
                                </optgroup>
                                <optgroup label="Implementación">
                                    <option value="instalacion">Instalación</option>
                                    <option value="configuracion">Configuración</option>
                                    <option value="migracion">Migración</option>
                                </optgroup>
                                <optgroup label="Mantenimiento">
                                    <option value="preventivo">Mantenimiento Preventivo</option>
                                    <option value="correctivo">Mantenimiento Correctivo</option>
                                    <option value="actualizacion">Actualizaciones</option>
                                </optgroup>
                                <optgroup label="Capacitación">
                                    <option value="talleres">Talleres</option>
                                    <option value="certificacion">Certificación</option>
                                    <option value="e-learning">E-learning</option>
                                </optgroup>
                            </select>
                        </div>

                        <div class="form-field">
                            <label for="subservicio">Detalle del servicio</label>
                            <select id="subservicio" name="subservicio">
                                <option value="" selected>Seleccione una opción (opcional)</option>
                                <optgroup label="Nivel Básico">
                                    <option value="basico-1">Paquete Básico 1</option>
                                    <option value="basico-2">Paquete Básico 2</option>
                                </optgroup>
                                <optgroup label="Nivel Profesional">
                                    <option value="pro-1">Paquete Profesional 1</option>
                                    <option value="pro-2">Paquete Profesional 2</option>
                                </optgroup>
                            </select>
                            <small class="field-help">
                                Este campo es opcional y depende del servicio seleccionado.
                            </small>
                        </div>
                    </section>

                    <!-- Urgencia -->
                    <fieldset>
                        <legend>
                            Urgencia del servicio
                            <span class="required-mark" aria-hidden="true">*</span>
                        </legend>
                        <div class="choice-list">
                            <label class="choice">
                                <input type="radio" name="urgencia" value="normal" checked required>
                                <span>Normal · 5 a 10 días hábiles</span>
                            </label>

                            <label class="choice">
                                <input type="radio" name="urgencia" value="urgente">
                                <span>Urgente · 2 a 3 días hábiles</span>
                            </label>

                            <label class="choice">
                                <input type="radio" name="urgencia" value="inmediata">
                                <span>Inmediata · 24 horas</span>
                            </label>
                        </div>
                    </fieldset>

                    <!-- Datos de contacto -->
                    <section class="form-block">
                        <h2>Datos de contacto</h2>

                        <div class="form-grid">
                            <div class="form-field">
                                <label for="nombre">
                                    Nombre completo
                                    <span class="required-mark" aria-hidden="true">*</span>
                                </label>
                                <input
                                    type="text"
                                    id="nombre"
                                    name="nombre"
                                    autocomplete="name"
                                    placeholder="Ej. María Rodríguez"
                                    required
                                >
                            </div>

                            <div class="form-field">
                                <label for="empresa">Empresa</label>
                                <input
                                    type="text"
                                    id="empresa"
                                    name="empresa"
                                    autocomplete="organization"
                                    placeholder="Ej. empresa S.A.S."
                                >
                            </div>
                        </div>

                        <div class="form-grid">
                            <div class="form-field">
                                <label for="email">
                                    Correo electrónico
                                    <span class="required-mark" aria-hidden="true">*</span>
                                </label>
                                <input
                                    type="email"
                                    id="email"
                                    name="email"
                                    autocomplete="email"
                                    placeholder="tucorreo@gmail.com"
                                    required
                                >
                            </div>

                            <div class="form-field">
                                <label for="telefono">Teléfono</label>
                                <input
                                    type="tel"
                                    id="telefono"
                                    name="telefono"
                                    autocomplete="tel"
                                    placeholder="+57 300 000 0000"
                                >
                            </div>
                        </div>
                    </section>
                    

                    <!-- Botones -->
                    <div class="form-actions">
                        <button type="submit" class="button button-primary">
                            Solicitar servicio
                        </button>
                        <button type="reset" class="button button-secondary">
                            Limpiar
                        </button>
                    </div>

                </form>
            </div>
        </section>
    </main>
</body>
</html>
