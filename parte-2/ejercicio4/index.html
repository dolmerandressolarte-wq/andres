<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ejercicio 4</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <main class="form-page">
        <section class="form-section">
            <div class="form-container">
                <header class="form-header">
                    <span class="eyebrow">TRABAJA CON NOSOTROS</span>
                    <h1>Solicitud de empleo</h1>
                    <p>
                        Complete el formulario y adjunte su CV. Los campos marcados con
                        <strong>*</strong> son obligatorios.
                    </p>
                </header>

                <form class="contact-form" action="#" method="post" enctype="multipart/form-data">

                    <!-- Datos personales -->
                    <section class="form-block">
                        <h2>Datos personales</h2>

                        <div class="form-grid">
                            <div class="form-field">
                                <label for="nombre">
                                    Nombre
                                    <span class="required-mark" aria-hidden="true">*</span>
                                </label>
                                <input
                                    type="text"
                                    id="nombre"
                                    name="nombre"
                                    autocomplete="given-name"
                                    placeholder="Ej. Juan"
                                    required
                                >
                            </div>

                            <div class="form-field">
                                <label for="apellido">
                                    Apellido
                                    <span class="required-mark" aria-hidden="true">*</span>
                                </label>
                                <input
                                    type="text"
                                    id="apellido"
                                    name="apellido"
                                    autocomplete="family-name"
                                    placeholder="Ej. Pérez"
                                    required
                                >
                            </div>
                        </div>

                        <div class="form-grid">
                            <div class="form-field">
                                <label for="email">
                                    Correo electrónico
                                    <span class="required-mark" aria-hidden="true">*</span>
                                </label>
                                <input
                                    type="email"
                                    id="email"
                                    name="email"
                                    autocomplete="email"
                                    placeholder="tucorreo@gmail.com"
                                    required
                                >
                            </div>

                            <div class="form-field">
                                <label for="telefono">
                                    Teléfono
                                    <span class="required-mark" aria-hidden="true">*</span>
                                </label>
                                <input
                                    type="tel"
                                    id="telefono"
                                    name="telefono"
                                    autocomplete="tel"
                                    placeholder="+57 300 000 0000"
                                    required
                                >
                            </div>
                        </div>

                        <div class="form-field">
                            <label for="ciudad">Ciudad de residencia</label>
                            <input
                                type="text"
                                id="ciudad"
                                name="ciudad"
                                placeholder="Ej. Bogotá"
                            >
                        </div>
                    </section>

                    <!-- Info profesional -->
                    <section class="form-block">
                        <h2>Información profesional</h2>

                        <div class="form-field">
                            <label for="puesto">
                                Puesto al que aplica
                                <span class="required-mark" aria-hidden="true">*</span>
                            </label>
                            <select id="puesto" name="puesto" required>
                                <option value="" selected disabled>Seleccione un puesto</option>
                                <optgroup label="Desarrollo">
                                    <option value="frontend">Desarrollador Frontend</option>
                                    <option value="backend">Desarrollador Backend</option>
                                    <option value="fullstack">Desarrollador Full Stack</option>
                                    <option value="mobile">Desarrollador Mobile</option>
                                </optgroup>
                                <optgroup label="Diseño">
                                    <option value="ux">Diseñador UX</option>
                                    <option value="ui">Diseñador UI</option>
                                    <option value="grafico">Diseñador Gráfico</option>
                                </optgroup>
                                <optgroup label="Datos">
                                    <option value="analista">Analista de Datos</option>
                                    <option value="cientifico">Científico de Datos</option>
                                </optgroup>
                                <optgroup label="Gestión">
                                    <option value="pm">Project Manager</option>
                                    <option value="scrum">Scrum Master</option>
                                </optgroup>
                            </select>
                        </div>

                        <div class="form-field">
                            <label for="experiencia">
                                Años de experiencia
                                <span class="required-mark" aria-hidden="true">*</span>
                            </label>
                            <input
                                type="number"
                                id="experiencia"
                                name="experiencia"
                                min="0"
                                max="50"
                                step="1"
                                placeholder="Ej. 3"
                                required
                            >
                        </div>
                    </section>

                    <!-- Modalidad -->
                    <fieldset>
                        <legend>Modalidad preferida</legend>
                        <div class="choice-list">
                            <label class="choice">
                                <input type="radio" name="modalidad" value="remoto" checked>
                                <span>Remoto</span>
                            </label>

                            <label class="choice">
                                <input type="radio" name="modalidad" value="hibrido">
                                <span>Híbrido</span>
                            </label>

                            <label class="choice">
                                <input type="radio" name="modalidad" value="presencial">
                                <span>Presencial</span>
                            </label>
                        </div>
                    </fieldset>

                    <!-- Habilidades (CHECKBOX) -->
                    <fieldset>
                        <legend>Habilidades principales</legend>
                        <div class="choice-list choice-list--grid">
                            <label class="choice">
                                <input type="checkbox" name="skills" value="html">
                                <span>HTML</span>
                            </label>

                            <label class="choice">
                                <input type="checkbox" name="skills" value="css">
                                <span>CSS</span>
                            </label>

                            <label class="choice">
                                <input type="checkbox" name="skills" value="js">
                                <span>JavaScript</span>
                            </label>

                            <label class="choice">
                                <input type="checkbox" name="skills" value="react">
                                <span>React</span>
                            </label>

                            <label class="choice">
                                <input type="checkbox" name="skills" value="node">
                                <span>Node.js</span>
                            </label>

                            <label class="choice">
                                <input type="checkbox" name="skills" value="python">
                                <span>Python</span>
                            </label>

                            <label class="choice">
                                <input type="checkbox" name="skills" value="sql">
                                <span>SQL</span>
                            </label>

                            <label class="choice">
                                <input type="checkbox" name="skills" value="figma">
                                <span>Figma</span>
                            </label>
                        </div>
                    </fieldset>

                    <!-- Adjuntar CV  -->
                    <section class="form-block">
                        <h2>Documentos</h2>

                        <div class="form-field">
                            <label for="cv">
                                Adjuntar CV
                                <span class="required-mark" aria-hidden="true">*</span>
                            </label>
                            <input
                                type="file"
                                id="cv"
                                name="cv"
                                accept=".pdf,.doc,.docx"
                                required
                            >
                            <small class="field-help">
                                Formatos aceptados: PDF, DOC, DOCX. Tamaño máximo: 5 MB.
                            </small>
                        </div>
                    </section>

                    <!-- Botones  -->
                    <div class="form-actions">
                        <button type="submit" class="button button-primary">
                            Enviar solicitud
                        </button>
                        <button type="reset" class="button button-secondary">
                            Limpiar
                        </button>
                    </div>

                </form>
            </div>
        </section>
    </main>
</body>
</html>
